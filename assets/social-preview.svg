<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAFAFB"/>
      <stop offset="100%" stop-color="#F2F2F5"/>
    </linearGradient>
    <linearGradient id="tile" x1="120" y1="180" x2="360" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F7"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#18181B" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <g stroke="#18181B" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Main Ceramic-White Icon Tile -->
  <g filter="url(#cardShadow)">
    <rect x="128" y="192" width="256" height="256" rx="62" fill="url(#tile)" stroke="#18181B" stroke-opacity="0.12" stroke-width="3"/>
    <g transform="translate(160, 224) scale(6)" stroke="#18181B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="8" cy="10" r="2.6"/>
      <circle cx="8" cy="22" r="2.6"/>
      <circle cx="24" cy="16" r="2.6"/>
      <path d="M10.6 10H15C17.8 10 18.2 16 21.4 16"/>
      <path d="M10.6 22H15C17.8 22 18.2 16 21.4 16"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="444" y="274" fill="#18181B" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-size="78" font-weight="600" letter-spacing="-2.4">Portline</text>
  <text x="446" y="336" fill="#52525B" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-size="27" font-weight="400">Zero-jargon multi-port desktop proxy workspace.</text>
  <text x="446" y="374" fill="#71717A" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-size="18.5" font-weight="400">High-density node ops, 0ms hot-switch, NetGuard safety, native v1.14+ schema.</text>

  <!-- Minimal Monochrome Pills -->
  <g transform="translate(446, 412)">
    <rect x="0" y="0" width="144" height="36" rx="18" fill="#18181B"/>
    <text x="72" y="23" text-anchor="middle" fill="#FFFFFF" font-family="'Cascadia Code', Consolas, monospace" font-size="14" font-weight="500">Rust + Tauri v2</text>

    <rect x="158" y="0" width="174" height="36" rx="18" fill="#FFFFFF" stroke="#18181B" stroke-opacity="0.12"/>
    <text x="245" y="23" text-anchor="middle" fill="#18181B" font-family="'Cascadia Code', Consolas, monospace" font-size="14" font-weight="500">Win / macOS / Linux</text>

    <rect x="346" y="0" width="130" height="36" rx="18" fill="#FFFFFF" stroke="#18181B" stroke-opacity="0.12"/>
    <text x="411" y="23" text-anchor="middle" fill="#18181B" font-family="'Cascadia Code', Consolas, monospace" font-size="14" font-weight="500">MIT Licensed</text>
  </g>
</svg>
